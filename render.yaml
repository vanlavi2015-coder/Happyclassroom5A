services:
  - type: web
    name: lop-hoc-5a
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TEACHER_PIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: lop-hoc-5a-data
      mountPath: /var/data
      sizeGB: 1
